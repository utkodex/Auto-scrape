<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in - Careers</title>
  <script src="common.js"></script>
  <style>body{font-family:sans-serif;max-width:720px;margin:2rem auto} label{display:block;font-weight:600} .row{margin:.6rem 0}</style>
</head>
<body>
  <h1>Sign in</h1>
  <form id="login" novalidate>
    <div class="row"><label for="user">Username</label><input id="user" name="user" type="text"></div>
    <div class="row"><label for="pass">Password</label><input id="pass" name="pass" type="password"></div>
    <div class="row"><button type="submit" id="signin">Sign in</button></div>
  </form>
  <script>
    document.getElementById("login").addEventListener("submit", (e) => {
      e.preventDefault();
      document.cookie = "sf_session=1; path=/";
      SF.go("apply_1.html");
    });
  </script>
</body>
</html>
